<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest – Lịch cá nhân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>

<body>
<div id="toast"></div>
<div class="app">

  <!-- THANH BÊN -->
  <aside class="side">
    <div class="logo">🌲 Forest</div>
    <small>WORKSPACE</small>
    <div id="nav" style="display:contents"></div>
    <div class="grow"></div>
    <button class="nav" id="bkb">⚙️ Sao lưu</button>
    <div class="qn"><small>QUICK NOTE</small>
      <textarea id="qn" placeholder="Đang nghĩ gì? Gõ ở đây…"></textarea>
    </div>
  </aside>

  <main class="main">
   

    <!-- LỊCH THÁNG -->
    <section>
      <div class="ch">
        <h1 id="title"></h1>
        <div class="seg" id="flt"></div>
        <button class="rd" id="prev">‹</button>
        <button class="rd" id="next">›</button>
        <button class="rd" id="today">Hôm nay</button>
      </div>
      <div class="dowrow" id="dow"></div>
      <div class="cal" id="grid"></div>
    </section>
  </main>
</div>

<dialog id="dlg">
  <h3 style="margin-top:0">Sao lưu / khôi phục</h3>
  <p class="mut">Dữ liệu lưu trong trình duyệt này. Bấm "Xuất" rồi chép đoạn mã đi cất. Muốn khôi phục thì dán vào ô rồi bấm "Nhập".</p>
  <textarea id="bk" style="height:120px"></textarea>
  <div class="row"><button class="pri" id="exp">Xuất</button><button class="pri" id="imp">Nhập</button><button class="rd" id="cls">Đóng</button></div>
</dialog>
 <!-- PANEL TRÁI: chi tiết ngày đang chọn -->
    <section class="panel" id="panel"></section>
<!-- Thứ tự nạp rất quan trọng: file nào dùng hàm của file khác thì phải đứng sau -->
<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/state.js"></script>
<script src="js/calendar.js"></script>
<script src="js/nav.js"></script>
<script src="js/panel.js"></script>
<script src="js/controls.js"></script>
<script src="js/quicknote.js"></script>
<script src="js/backup.js"></script>
<script src="js/reminders.js"></script>
<script src="js/main.js"></script>
</body>
</html>
